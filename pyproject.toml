[project]
name = "cvopt"
version = "0.1.0"
description = "CV optimizer: tailors a CV to a job description from verified claims"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "aiosqlite>=0.22.1",
    "alembic>=1.20.1",
    "anthropic>=2.3.0",
    "filelock>=4.2.4",
    "httpx>=0.28.1",
    "jsonschema>=4.26.0",
    "lingua-language-detector>=2.2.0",
    "pydantic>=2.9",
    "pypdf>=6.21.2",
    "python-docx>=1.2.0",
    "python-ulid>=4.0.1",
    "rapidfuzz>=3.14.6",
    "rich>=13.9",
    "sqlalchemy[asyncio]>=2.0",
    "trafilatura>=2.3.1",
    "typer>=0.15",
    "typst>=0.15.0",
]

[project.scripts]
cvopt = "cvopt.cli.main:app"

[dependency-groups]
dev = [
    "hypothesis>=6.100",
    "import-linter>=2.1",
    "mypy>=1.13",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.8",
    "types-jsonschema>=4.26.0.20261006",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cvopt"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.mypy]
python_version = "3.12"
files = ["src/cvopt"]
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["cvopt.domain.*", "cvopt.llm.*"]
strict = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = ["live: calls the real LLM provider"]
addopts = "-m 'not live'"

[tool.importlinter]
root_package = "cvopt"

[[tool.importlinter.contracts]]
name = "domain imports only itself and Pydantic"
type = "forbidden"
source_modules = ["cvopt.domain"]
forbidden_modules = [
    "cvopt.llm", "cvopt.services", "cvopt.adapters", "cvopt.cli",
    "cvopt.ports", "cvopt.bootstrap", "cvopt.config", "cvopt.context",
]

[[tool.importlinter.contracts]]
name = "llm adds only ports"
type = "forbidden"
source_modules = ["cvopt.llm"]
forbidden_modules = ["cvopt.services", "cvopt.adapters", "cvopt.cli", "cvopt.bootstrap"]

[[tool.importlinter.contracts]]
name = "services add only llm"
type = "forbidden"
source_modules = ["cvopt.services"]
forbidden_modules = ["cvopt.adapters", "cvopt.cli", "cvopt.bootstrap"]

[[tool.importlinter.contracts]]
name = "adapters import only ports and domain"
type = "forbidden"
source_modules = ["cvopt.adapters"]
forbidden_modules = ["cvopt.llm", "cvopt.services", "cvopt.cli", "cvopt.bootstrap"]

[[tool.importlinter.contracts]]
name = "cli imports services and bootstrap, not adapters or llm"
type = "forbidden"
source_modules = ["cvopt.cli"]
forbidden_modules = ["cvopt.adapters", "cvopt.llm"]
allow_indirect_imports = true  # via bootstrap, the composition root
